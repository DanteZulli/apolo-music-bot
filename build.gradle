plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.zullid'
version = '0.0.1-SNAPSHOT'
description = 'A self-hosted, feature-rich music bot for Discord.'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

ext {
    jdaVersion = '6.5.0'
    lavaplayerVersion = '2.2.7'
    lavalinkYoutubeVersion = '1.18.2'
    jdaveVersion = '0.1.8'
    logstashEncoderVersion = '8.0'
}

dependencies {
    implementation "dev.arbjerg:lavaplayer:${lavaplayerVersion}"
    implementation "dev.lavalink.youtube:v2:${lavalinkYoutubeVersion}"

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation "net.dv8tion:JDA:${jdaVersion}"

    implementation "club.minnced:jdave-api:${jdaveVersion}"
    runtimeOnly "club.minnced:jdave-native-linux-x86-64:${jdaveVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    finalizedBy(tasks.named('jacocoTestReport'))
    finalizedBy(tasks.named('jacocoTestCoverageVerification'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn(tasks.named('test'))
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            // Only known gap: the unreachable queue.offer() false side
            // until the queue is bounded (current ratio 59/60).
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.98
            }
        }
    }
}

tasks.named('check') {
    dependsOn(tasks.named('jacocoTestCoverageVerification'))
}
