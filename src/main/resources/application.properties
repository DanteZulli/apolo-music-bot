spring.application.name=apolo-music-bot
spring.profiles.active=dev

discord.bot.token=${DISCORD_BOT_TOKEN}

# JDA is very chatty at DEBUG (gateway, REST, audio); keep it at WARN by default.
# Raise via env when debugging voice, e.g. LOGGING_LEVEL_NET_DV8TION_JDA=DEBUG.
logging.level.com.zullid.apolo_music_bot=INFO
logging.level.net.dv8tion.jda=WARN
logging.level.org.springframework=INFO
